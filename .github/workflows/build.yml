name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compilar plugin
        run: gradle build --no-daemon

      - name: Empaquetar resource pack
        run: |
          (cd resourcepack && zip -r ../build/libs/Crews-ResourcePack.zip .)
          echo "SHA1 del resource pack:"
          sha1sum build/libs/Crews-ResourcePack.zip | cut -d' ' -f1 | tee build/libs/Crews-ResourcePack.sha1

      - uses: actions/upload-artifact@v4
        with:
          name: Crews
          path: |
            build/libs/Crews-*.jar
            build/libs/Crews-ResourcePack.zip
            build/libs/Crews-ResourcePack.sha1

      - name: Publicar release (solo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/Crews-*.jar
            build/libs/Crews-ResourcePack.zip
            build/libs/Crews-ResourcePack.sha1
